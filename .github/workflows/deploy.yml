name: Build, Test & Deploy SahihAgent

on:
  push:
    branches:
      - main

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & lint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py

      - name: Build Docker container
        run: docker build -t sahih-agent:latest .

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Production Deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "No DEPLOY_WEBHOOK_URL secret configured. Skipping webhook call."
            exit 0
          fi
          curl -f -X POST "$DEPLOY_WEBHOOK_URL"
